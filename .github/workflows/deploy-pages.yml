name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya esté corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El base-href debe coincidir con el nombre del repo, porque Pages sirve
      # el sitio bajo https://<usuario>.github.io/<repo>/
      - name: Build
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages no reescribe rutas hacia index.html, así que un refresco en
      # /misiones daría 404. Servir el mismo index como 404.html hace que el
      # router de Angular resuelva la ruta en el cliente.
      - name: Fallback SPA
        run: cp dist/ocs-platform/browser/index.html dist/ocs-platform/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ocs-platform/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
